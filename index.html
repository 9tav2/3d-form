<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заказ 3D-печати</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      margin: 0;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    h2 { margin-top: 0; text-align: center; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 8px;
      box-sizing: border-box;
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000000);
      font-size: 15px;
    }
    textarea { resize: vertical; height: 80px; }
    button {
      width: 100%;
      padding: 12px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h2>📦 Заказ 3D-печати</h2>

  <form id="orderForm">
    <div class="form-group">
      <label for="name">Ваше имя *</label>
      <input type="text" id="name" required placeholder="Как к вам обращаться">
    </div>

    <div class="form-group">
      <label for="contact">Телефон или соцсеть *</label>
      <input type="text" id="contact" required placeholder="+375(00)000-00-00 или @username">
    </div>

    <div class="form-group">
      <label for="description">Описание изделия *</label>
      <textarea id="description" required placeholder="Что нужно напечатать, цвет, пластик..."></textarea>
    </div>

    <div class="form-group">
      <label for="dimensions">Размеры изделия *</label>
      <input type="text" id="dimensions" required placeholder="Например: 10х5х5 см">
    </div>

    <div class="form-group">
      <label for="photo_url">Ссылка на фото / файл (необязательно)</label>
      <input type="url" id="photo_url" placeholder="https://диск/ссылка_на_фото">
    </div>

    <button type="submit">Отправить заказ</button>
  </form>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем форму на весь экран

    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const data = {
        name: document.getElementById('name').value,
        contact: document.getElementById('contact').value,
        description: document.getElementById('description').value,
        dimensions: document.getElementById('dimensions').value,
        photo_url: document.getElementById('photo_url').value || "Не указана"
      };

      // Передаем данные обратно боту
      tg.sendData(JSON.stringify(data));
      tg.close();
    });
  </script>
</body>
</html>
