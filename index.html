<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заказ 3D-печати</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      margin: 0;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    h2 { margin-top: 0; text-align: center; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 8px;
      box-sizing: border-box;
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000000);
      font-size: 15px;
    }
    textarea { resize: vertical; height: 80px; }
    button {
      width: 100%;
      padding: 12px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-size: 13px;
      color: var(--tg-theme-hint-color, #888);
      text-align: center;
    }
  </style>
</head>
<body>

  <h2>📦 Заказ 3D-печати</h2>

  <form id="orderForm">
    <div class="form-group">
      <label for="name">Ваше имя *</label>
      <input type="text" id="name" required placeholder="Как к вам обращаться">
    </div>

    <div class="form-group">
      <label for="contact">Телефон или соцсеть *</label>
      <input type="text" id="contact" required placeholder="+375(00)000-00-00 или @username">
    </div>

    <div class="form-group">
      <label for="description">Описание изделия *</label>
      <textarea id="description" required placeholder="Что нужно напечатать, цвет, пластик..."></textarea>
    </div>

    <div class="form-group">
      <label for="dimensions">Размеры изделия *</label>
      <input type="text" id="dimensions" required placeholder="Например: 10х5х5 см">
    </div>

    <div class="form-group">
      <label for="photo_file">Прикрепить фото / эскиз</label>
      <input type="file" id="photo_file" accept="image/*">
    </div>

    <button type="submit" id="submitBtn">Отправить заказ</button>
    <div id="status"></div>
  </form>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const IMGBB_API_KEY = "1652f41fce519e6b583580dec06063e1"; // Замените на ваш API-ключ ImgBB

    document.getElementById('orderForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const statusDiv = document.getElementById('status');
      const fileInput = document.getElementById('photo_file');

      submitBtn.disabled = true;
      let photoUrl = "Не указана";

      // Если выбран файл, загружаем его на ImgBB
      if (fileInput.files.length > 0) {
        statusDiv.innerText = "Загрузка фото...";
        const formData = new FormData();
        formData.append("image", fileInput.files[0]);

        try {
          const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: "POST",
            body: formData
          });

          const result = await response.json();
          if (result.success) {
            photoUrl = result.data.url;
          } else {
            alert("Ошибка загрузки фото, заказ будет отправлен без него.");
          }
        } catch (err) {
          console.error("Ошибка при отправке файла:", err);
        }
      }

      statusDiv.innerText = "Отправка заказа...";

      const data = {
        name: document.getElementById('name').value,
        contact: document.getElementById('contact').value,
        description: document.getElementById('description').value,
        dimensions: document.getElementById('dimensions').value,
        photo_url: photoUrl
      };

      tg.sendData(JSON.stringify(data));
      tg.close();
    });
  </script>
</body>
</html>
